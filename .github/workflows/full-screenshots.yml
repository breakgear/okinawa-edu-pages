name: 代表ページの全体を撮影

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/full-targets.json'
      - 'scripts/shoot-full.mjs'

permissions:
  contents: write

concurrency:
  group: full-screenshots
  cancel-in-progress: false

jobs:
  shoot-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 必要なものをインストール
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: 代表ページの全体を撮影
        run: node scripts/shoot-full.mjs

      - name: 撮った画像を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A public/full public/full-shots.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "代表ページの全体画像を更新"
            git pull --rebase origin main
            git push
          fi
